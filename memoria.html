<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Jogo da Memória — Tio Tatá - Jogos</title>
<meta name="theme-color" content="#6C47FF">
<link rel="icon" href="assets/images/tio-tata-icone.png" type="image/png">
<link rel="apple-touch-icon" href="assets/images/app-icone-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tio Tatá">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/memoria.css">
</head>
<body style="--accent:#E0457F; --accent-50:#FDE8F0; --grad:linear-gradient(135deg, #DB2777 0%, #F43F5E 100%); --glow:rgba(219,39,119,.45);">
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html" aria-label="Tio Tatá - Jogos"><img src="assets/images/tio-tata-rosto.webp" alt="" width="40" height="40">Tio Tatá<span class="brand-sub">Jogos</span></a>
    <a class="back-link" href="index.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg>Todos os jogos</a>
  </div>
</header>

<section class="page-hero">
  <div class="page-hero-inner">
  <div class="page-head">
    <span class="page-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="12" height="15" rx="2"/><path d="M9 3h10a2 2 0 0 1 2 2v12"/></svg></span>
    <div>
      <h1>Jogo da Memória</h1>
      <p class="subtitle">Vire duas cartas por vez e encontre a figura e a palavra que combinam.</p>
    </div>
  </div>
  <img class="page-art" src="assets/images/urso.webp" alt="" aria-hidden="true">
  </div>
</section>

<main class="wrap wrap-overlap">
  <div class="game-window" id="gameWindow">
  <div class="levels" role="group" aria-label="Nível">
    <button class="m-level-btn level-btn active" data-level="facil">Fácil <small>6 pares</small></button>
    <button class="m-level-btn level-btn" data-level="medio">Médio <small>8 pares</small></button>
    <button class="m-level-btn level-btn" data-level="dificil">Difícil <small>10 pares</small></button>
  </div>

  <div class="progress-row">
    <span class="progress-pill" id="mProgressText">0 / 6 pares</span>
    <span class="progress-pill score-pill" id="mScoreText">0 pontos</span>
    <button id="mNewBtn" class="m-new-btn">Novo jogo</button>
    <button id="soundBtn" title="Ligar/desligar o som"></button>
  </div>

  <div class="memory-stage">
    <div class="memory-grid" id="mGrid" aria-label="Cartas do jogo da memória"></div>
    <div class="memory-congrats" id="mCongrats">
      <div class="msg">🎉 Você achou todos os pares!</div>
      <div class="sub" id="mCongratsText"></div>
      <button id="mAgainBtn" class="m-new-btn">Jogar de novo</button>
    </div>
  </div>
  </div>

  <section class="card gallery-wrap" aria-labelledby="albumTitle">
    <div class="album-head">
      <div>
        <h2 class="gallery-title" id="albumTitle">Álbum de figurinhas</h2>
        <p class="album-sub" id="albumCount">0 figurinhas coletadas</p>
      </div>
      <button id="albumToggleBtn" aria-expanded="false">Ver álbum</button>
    </div>
    <div class="album-bar"><span id="albumBar"></span></div>
    <div class="gallery" id="gallery"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="site-footer-inner">
    <span>© Tio Tatá - Jogos · Alfabetização e matemática brincando</span>
    <a href="index.html">Ver todos os jogos</a>
  </div>
</footer>
<script src="assets/js/word-bank.js"></script>
<script src="assets/js/shared-utils.js"></script>
<script src="assets/js/memoria.js"></script>
</body>
</html>
