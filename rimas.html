<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Rimas — Tio Tatá - Jogos</title>
<meta name="theme-color" content="#6C47FF">
<link rel="icon" href="assets/images/tio-tata-icone.png" type="image/png">
<link rel="apple-touch-icon" href="assets/images/app-icone-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tio Tatá">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/quiz.css">
</head>
<body style="--accent:#A21CAF; --accent-50:#FAE8FF; --grad:linear-gradient(135deg, #A21CAF 0%, #F472B6 100%); --glow:rgba(162,28,175,.42);">
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html" aria-label="Tio Tatá - Jogos"><img src="assets/images/tio-tata-rosto.webp" alt="" width="40" height="40">Tio Tatá<span class="brand-sub">Jogos</span></a>
    <a class="back-link" href="index.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg>Todos os jogos</a>
  </div>
</header>

<section class="page-hero">
  <div class="page-hero-inner">
  <div class="page-head">
    <span class="page-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
    <div>
      <h1>Rimas</h1>
      <p class="subtitle">Ouça a palavra e encontre a figura que rima com ela: GATO rima com PATO!</p>
    </div>
  </div>
  <img class="page-art" src="assets/images/pato.webp" alt="" aria-hidden="true">
  </div>
</section>

<main class="wrap wrap-overlap">
  <div class="game-window" id="gameWindow">
  <div class="levels" role="group" aria-label="Nível">
    <button class="level-btn active" data-level="facil">Fácil <small>3 figuras</small></button>
    <button class="level-btn" data-level="medio">Médio <small>4 figuras</small></button>
    <button class="level-btn" data-level="dificil">Difícil <small>só palavras</small></button>
  </div>

  <div class="progress-row">
    <span class="progress-pill" id="qProgress">Rodada 1</span>
    <span class="progress-pill score-pill" id="qScore">0 pontos</span>
    <button id="qNewBtn" class="m-new-btn">Novo jogo</button>
    <button id="soundBtn" title="Ligar/desligar o som"></button>
  </div>

  <div class="q-stage rm-stage" id="qStage">
    <div class="rm-target">
      <div class="q-card"><img class="q-art" id="qArt" src="assets/images/logo.webp" alt=""><button class="q-listen" id="qListen" aria-label="Ouvir a palavra"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></button></div>
      <div class="rm-word" id="rmWord"></div>
    </div>
    <p class="q-question" id="qQuestion">Qual figura rima com esta?</p>
    <div class="dt-options rm-options" id="qOptions"></div>
  </div>

  <div class="q-final" id="qFinal" hidden>
    <div class="q-final-emoji">🏆</div>
    <div class="q-final-msg">Muito bem!</div>
    <div class="q-final-sub" id="qFinalText"></div>
    <button id="qAgainBtn" class="m-new-btn">Jogar de novo</button>
  </div>
  </div>

  <section class="card gallery-wrap" aria-labelledby="albumTitle">
    <div class="album-head">
      <div>
        <h2 class="gallery-title" id="albumTitle">Álbum de figurinhas</h2>
        <p class="album-sub" id="albumCount">0 figurinhas coletadas</p>
      </div>
      <button id="albumToggleBtn" aria-expanded="false">Ver álbum</button>
    </div>
    <div class="album-bar"><span id="albumBar"></span></div>
    <div class="gallery" id="gallery"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="site-footer-inner">
    <span>© Tio Tatá - Jogos · Alfabetização e matemática brincando</span>
    <a href="index.html">Ver todos os jogos</a>
  </div>
</footer>
<script src="assets/js/word-bank.js"></script>
<script src="assets/js/shared-utils.js"></script>
<script src="assets/js/rimas.js"></script>
</body>
</html>
